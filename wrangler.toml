# Cloudflare Pages 项目配置
# 作用：① 记录 Pages 项目名与产物目录；② 支持 `npx wrangler pages dev dist` 本地按 CF 环境预览。
# 走 CF Pages 的 Git 集成时，构建命令与 Node 版本在控制台/环境变量里设，见下列注释。
name = "cloudwing-terminal"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-26"

# ── 在 Cloudflare Pages 控制台需要设的东西（本文件无法代替）──────────────
#   构建命令       npm run build
#                 （已含 `npm run generate:lab-content` —— 模板原本的 build 缺这一步，
#                   干净 clone 直跑会挂在 check:features: src/blog-adapter.ts →
#                   ../.generated/lab-content.json 无法解析。已在 package.json 里补上。）
#   输出目录       dist
#   NODE_VERSION   22.23.2
#                 （README 写 24.14.0，但实测 Node 22.23.2 下 npm ci 与 npm run build 均通过；
#                   选已实测的版本更稳。要改的话两处一起改。）
#   BLOG_SITE_ORIGIN（可选）https://cloudwing.top
#                 （astro.config.mjs 的默认值已改成它，不设也对。）
